<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conectando con TikTok — Retami</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #f2f2f2; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .card { text-align: center; padding: 32px 24px; max-width: 420px; }
    .logo { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #a8a8a8; line-height: 1.5; margin: 0; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Retami">
    <h1 id="titulo">Conectando con TikTok…</h1>
    <p id="texto">Volviendo a Retami Publicador.</p>
  </div>
  <script>
    // Retorno del inicio de sesión de TikTok (Login Kit) para la herramienta
    // interna "Retami Publicador", que corre en el ordenador del equipo.
    // Esta página no guarda nada: solo reenvía el código a la herramienta local.
    var q = new URLSearchParams(location.search)
    if (q.get('error')) {
      document.getElementById('titulo').textContent = 'No se ha conectado'
      document.getElementById('texto').textContent = q.get('error_description') || q.get('error')
      document.getElementById('texto').className = 'err'
    } else if (q.get('code')) {
      location.replace('http://localhost:4545/callback' + location.search)
    } else {
      document.getElementById('titulo').textContent = 'Retami Publicador'
      document.getElementById('texto').textContent = 'Herramienta interna del equipo de Retami para publicar nuestros vídeos en TikTok.'
    }
  </script>
</body>
</html>
